# Codex reaches Engram through MCP (ADR 0022). Its PreToolUse hook, in
# .codex/hooks.json beside this file (card E8.17), blocks store commands and
# store paths; reads stay unfiltered by the plane on this path, as condition C7
# states. The log is the per-user default, <home>/.engram/engram.db (decision
# D9), outside the project the model edits.
[mcp_servers.engram]
command = "engram"
args = ["mcp", "--as", "person:dana", "--member", "person:dana", "--root", "memory", "--owner", "dana", "--import-valid-from", "2026-10-01T00:00:00.000Z"]
