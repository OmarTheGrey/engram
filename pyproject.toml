# uv workspace: research only. The TypeScript workspace is pnpm-workspace.yaml.
[tool.uv.workspace]
members = ["research"]

[tool.uv.sources]
engram-research = { workspace = true }

[dependency-groups]
dev = ["engram-research"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated by `make api`; checked by mypy, not by ruff.
extend-exclude = ["research/engram_types"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "engram_types", "analysis"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["research"]
mypy_path = "research"
explicit_package_bases = true
