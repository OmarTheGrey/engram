name: conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Describe the PR for the gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr/body.md"
          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/pr/files.txt"
      - name: PR names an acceptance command and adds a valid log entry
        run: node scripts/check-pr.ts "$RUNNER_TEMP/pr" .
      - name: Prose and log entries across the repository
        run: make lint-docs
