name: ci

on:
  push:
  workflow_dispatch:

env:
  ENGRAM_OFFLINE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v10
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: make lint
      - run: make test
