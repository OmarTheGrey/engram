# Card E2.18: a development tool that asks Cedar's symbolic compiler
# (cedar-policy-symcc, Apache-2.0) to prove implications between Cedar policy
# sets written by Engram's exportCedar. Not part of any package, not built by
# make test; `make verify-policy` builds it. Versions are exact (AGENTS.md
# rule 11) and Cargo.lock is committed.
[package]
name = "engram-symcc"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
cedar-policy = "=4.14.1"
cedar-policy-symcc = "=0.8.1"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "macros"] }

[profile.release]
debug = false
