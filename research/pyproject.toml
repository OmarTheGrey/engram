[project]
name = "engram-research"
version = "0.0.0"
description = "Engram research code: configs, scripts, results, analysis, thesis."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scripts"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
