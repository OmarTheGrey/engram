# Preset: strict. The governed end of the strictness sweep (X5, H2).
#
# Stance: only first-hand sources travel beyond a person. Model-written and
# compaction content is untrusted (ADR 0004, 0007): model content stays in
# person scope, compaction is refused everywhere, and nothing derived from a
# tool or an import reaches org. Episodic records never leave person scope.
# Every shared scope requires review, and confidence floors rise with reach.
# Reads follow the hierarchy downwards only: a context reads its own level
# and the levels above it, never person scope except as that person. Grants
# are honoured, since they are explicit consent (ADR 0021). Retention retires,
# never deletes (ADR 0010), and covers every class each scope admits.
# Promotion follows the mechanism of ADR 0011 and asks for more confirmations
# and a clean replay record than the other presets.
#
# Lints: lints.enabled lists the lints a lint-running condition (C6) uses; it
# does not turn lints on. C5 runs the write gate and the read filter only,
# whatever this list says. Every lint is listed here, the model-based ones
# included. replay-drift and environment-changed are procedural lifecycle
# triggers (ADR 0011), not lints; lints.thresholds sets the drift trigger's
# success floor and minimum trials.
#
# Numbers: the confidence floors, ttls, budgets, confirmation counts, replay
# k of n and thresholds are proposed values chosen for this preset, not taken
# from ADR 0011 or any other source; they are reviewed before any run.
id: preset.strict
version: 1
write:
  - scope: person
    allowed_sources: [user, document, tool, import, model]
    confidence_floor: 0.5
    forbidden_classes: []
    requires_review: false
  - scope: role
    allowed_sources: [user, document, tool]
    confidence_floor: 0.7
    forbidden_classes: [episodic]
    requires_review: true
  - scope: team
    allowed_sources: [user, document, tool]
    confidence_floor: 0.8
    forbidden_classes: [episodic]
    requires_review: true
  - scope: org
    allowed_sources: [user, document]
    confidence_floor: 0.9
    forbidden_classes: [episodic, procedural]
    requires_review: true
read:
  matrix:
    - reader: person
      may_read: [person, role, team, org]
    - reader: role
      may_read: [role, team, org]
    - reader: team
      may_read: [team, org]
    - reader: org
      may_read: [org]
  honour_grants: true
retention:
  - scope: person
    class: episodic
    ttl: 2592000 # 30 days
    budget: 1000
    eviction: recency
  - scope: person
    class: semantic
    ttl: null
    budget: 500
    eviction: utility
  - scope: person
    class: procedural
    ttl: null
    budget: 100
    eviction: utility
  - scope: role
    class: semantic
    ttl: null
    budget: 500
    eviction: utility
  - scope: role
    class: procedural
    ttl: null
    budget: 100
    eviction: utility
  - scope: team
    class: semantic
    ttl: null
    budget: 2000
    eviction: utility
  - scope: team
    class: procedural
    ttl: null
    budget: 200
    eviction: utility
  - scope: org
    class: semantic
    ttl: null
    budget: null
    eviction: manual
promotion:
  episodic_to_semantic:
    confirmations: 5
    or_review: true
  procedural:
    replay_k: 5
    replay_n: 5
lints:
  enabled:
    - expired-validity
    - source-changed
    - scope-class-mismatch
    - missing-provenance
    - orphan
    - duplicate
    - contradiction
    - unsupported-claim
  thresholds:
    near-duplicate: 0.8
    replay-drift.success-floor: 0.8
    replay-drift.min-trials: 10
schema_version: 0
