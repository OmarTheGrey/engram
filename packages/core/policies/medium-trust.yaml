# Preset: medium-trust. The medium preset with both trust floors on (card
# E2.11, ADR 0040). It is no registered condition of H1 to H4: it is not in
# PRESETS, and the medium preset itself is unchanged.
#
# Stance: medium's, and in addition:
#
# - trust.unattested_floor: a write whose actor attests no source (a library
#   caller, an HTTP client that sends none) is recorded at kind external, the
#   least trusted, as that actor's, whatever it claimed. So it confirms no
#   promotion, cannot restate retired content, carries no grant and stays in
#   person scope. Person scope admits external here, which medium does not,
#   so such a writer still writes there at the lowest trust: a floor, not a
#   refusal (ADR 0040, alternatives).
# - trust.protect_trusted: a source less trusted than an active item's kind
#   never rewrites or retires it (engram/write/downgrade), and a budget
#   eviction never chooses a victim more trusted than the write or sweep that
#   triggered it; a write that would need one is denied. The item's owner
#   acting as user is exempt.
#
# The limit (docs/architecture.md): over the HTTP API the source is
# self-asserted, as the actor id is (ADR 0027), so a client that sends
# source user is believed. Verified actors (card E8.12) close it.
#
# Every other line is medium's, with medium's comments in policies/medium.yaml.
id: preset.medium-trust
version: 1
write:
  - scope: person
    allowed_sources: [user, document, tool, import, model, compaction, external]
    confidence_floor: 0.3
    forbidden_classes: []
    requires_review: false
  - scope: role
    allowed_sources: [user, document, tool, import]
    confidence_floor: 0.5
    forbidden_classes: [episodic]
    requires_review: false
  - scope: team
    allowed_sources: [user, document, tool, import]
    confidence_floor: 0.6
    forbidden_classes: [episodic]
    requires_review: false
  - scope: org
    allowed_sources: [user, document, tool, import]
    confidence_floor: 0.8
    forbidden_classes: [episodic]
    requires_review: true
read:
  matrix:
    - reader: person
      may_read: [person, role, team, org]
    - reader: role
      may_read: [person, role, team, org]
    - reader: team
      may_read: [role, team, org]
    - reader: org
      may_read: [team, org]
  honour_grants: true
retention:
  - scope: person
    class: episodic
    ttl: 7776000 # 90 days
    budget: 5000
    eviction: recency
  - scope: person
    class: semantic
    ttl: null
    budget: 2000
    eviction: utility
  - scope: person
    class: procedural
    ttl: null
    budget: 200
    eviction: utility
  - scope: role
    class: semantic
    ttl: null
    budget: 2000
    eviction: utility
  - scope: role
    class: procedural
    ttl: null
    budget: 200
    eviction: utility
  - scope: team
    class: semantic
    ttl: null
    budget: 10000
    eviction: utility
  - scope: team
    class: procedural
    ttl: null
    budget: 500
    eviction: utility
  - scope: org
    class: semantic
    ttl: null
    budget: null
    eviction: manual
  - scope: org
    class: procedural
    ttl: null
    budget: null
    eviction: manual
promotion:
  episodic_to_semantic:
    confirmations: 3
    or_review: true
  procedural:
    replay_k: 4
    replay_n: 5
lints:
  enabled:
    - expired-validity
    - source-changed
    - scope-class-mismatch
    - missing-provenance
    - orphan
    - duplicate
  thresholds:
    near-duplicate: 0.85
    replay-drift.success-floor: 0.7
    replay-drift.min-trials: 10
trust:
  unattested_floor: "on"
  protect_trusted: "on"
schema_version: 1
