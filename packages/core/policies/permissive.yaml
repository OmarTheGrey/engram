# Preset: permissive. The loose end of the strictness sweep (X5, H2).
#
# Stance: as close to ungoverned as the plane's commitments allow. Every class
# may go to every scope, confidence floors are low and nothing waits for
# review. Two commitments stay: model-written and compaction content does not
# leave person scope (ADR 0004, 0007), and team and org contexts never read
# person scope except through a grant (ADR 0021). Any other context may read
# any level it is a member of. Retention retires, never deletes (ADR 0010),
# with large budgets. Promotion needs fewer confirmations and a looser replay
# record (ADR 0011). Only the lints that keep the record sound are on:
# validity, provenance and procedure drift.
id: preset.permissive
version: 1
write:
  - scope: person
    allowed_sources: [user, document, tool, import, model, compaction]
    confidence_floor: 0.0
    forbidden_classes: []
    requires_review: false
  - scope: role
    allowed_sources: [user, document, tool, import]
    confidence_floor: 0.2
    forbidden_classes: []
    requires_review: false
  - scope: team
    allowed_sources: [user, document, tool, import]
    confidence_floor: 0.3
    forbidden_classes: []
    requires_review: false
  - scope: org
    allowed_sources: [user, document, tool, import]
    confidence_floor: 0.5
    forbidden_classes: []
    requires_review: false
read:
  matrix:
    - reader: person
      may_read: [person, role, team, org]
    - reader: role
      may_read: [person, role, team, org]
    - reader: team
      may_read: [role, team, org]
    - reader: org
      may_read: [role, team, org]
  honour_grants: true
retention:
  - scope: person
    class: episodic
    ttl: null
    budget: 20000
    eviction: recency
  - scope: person
    class: semantic
    ttl: null
    budget: 10000
    eviction: utility
  - scope: team
    class: semantic
    ttl: null
    budget: 50000
    eviction: utility
  - scope: org
    class: semantic
    ttl: null
    budget: null
    eviction: manual
promotion:
  episodic_to_semantic:
    confirmations: 2
    or_review: true
  procedural:
    replay_k: 3
    replay_n: 5
lints:
  enabled:
    - expired-validity
    - missing-provenance
    - replay-drift
    - environment-changed
  thresholds:
    near-duplicate: 0.9
    replay-drift.success-floor: 0.6
    replay-drift.min-trials: 10
schema_version: 0
